[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-origin-cli"
version = "0.1.0"
description = "Terminal-first computational physics toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "rich>=13",
    "platformdirs>=4",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
quantum = "quantum_cli.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
